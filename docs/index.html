<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Rocket Game - Pyxel Web</title>
    <script src="pyxel.js"></script> <!-- ローカル読み込みに変更 -->
  </head>
  <body class="pyxel-scheme">
    <script>
      launchPyxel({
        root: ".",                   // カレントフォルダ（docs/）を指定
        command: "play",
        name: "rocket.pyxapp"
      });
    </script>
  </body>
</html>
